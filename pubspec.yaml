name: base
description: "A new Flutter project."
publish_to: 'none'


version: 1.1.0+4 #ios
#version: 1.0.0+1 #android

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  auto_route: ^10.0.1
  firebase_core: ^3.13.0
  provider: ^6.1.5
  easy_localization: ^3.0.7+1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  flutter_svg: ^2.1.0
  in_app_review: ^2.0.10
  package_info_plus: ^8.3.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  purchases_flutter: ^8.7.5
  firebase_analytics: ^11.4.5
  get_it: ^8.0.3
  http: ^1.3.0
  rename: ^3.0.2
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0
  google_nav_bar: ^5.0.7
  table_calendar: ^3.2.0
  image_picker: ^1.2.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  file_picker: ^8.1.6
  record: ^7.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  auto_route_generator: ^10.0.1
  flutter_lints: ^4.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/logos/

flutter_launcher_icons:
  android: "1024"
  ios: true
  image_path: "assets/logos/1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF" # veya uygulamanızın tema rengini kullanın
  adaptive_icon_foreground: "assets/logos/1024.png"
